name: Release CreditLens

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm test
          npm run lint
          npm run build

      - name: Archive dist
        run: tar -czf creditlens-dist.tar.gz dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: creditlens-dist.tar.gz
          generate_release_notes: true
